services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: carebridge
      POSTGRES_USER: carebridge
      POSTGRES_PASSWORD: carebridge_dev_password
    ports: ["5432:5432"]
    volumes:
      - carebridge_data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carebridge -d carebridge"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  carebridge_data:
